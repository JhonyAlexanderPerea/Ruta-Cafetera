[project]
name = "rutas"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "osmnx",
  "geopandas",
  "pyproj",
  "pandas",
  "numpy",
  "matplotlib",
  "altair",
  "folium",
  "streamlit",
  "streamlit-folium",
  "psutil",
  "py-cpuinfo",
]

[dependency-groups]
dev = [
  "pytest",
  "hypothesis",
  "ruff",
  "mypy",
  "pre-commit",
  "scipy",      # SOLO para verificar la envolvente 
  "networkx",   # SOLO para verificar Dijkstra
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rutas"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# CSS, JS y rutas SVG en línea: no se parten sin romper el contenido.
"src/rutas/report/mapas.py" = ["E501"]
"src/rutas/report/iconos.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]